name: Rust cross-platform

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo build --release --locked
      - run: cargo run --release --locked -- --help
      - run: cargo run --release --locked -- scan tests/parity_sample --json
      - run: python -m pip install -e . --no-build-isolation
      - run: python tests/check_parity.py target/release/mediaforge
