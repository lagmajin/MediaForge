[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaforge-cli"
version = "0.1.0"
description = "Fast, local-first CLI utilities for game and video production assets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MediaForge contributors" }]
keywords = ["cli", "media", "game-dev", "video", "assets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Multimedia :: Video",
  "Topic :: Games/Entertainment",
]

[project.scripts]
mediaforge = "mediaforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
